{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h2 class="h4 mb-0">Crear Nuevo Producto</h2>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej. Sonido Profesional" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo de Servicio</label>
                        <select name="tipo" class="form-select">
                            <option value="maquinaria">Maquinaria</option>
                            <option value="comida">Comida</option>
                            <option value="animacion">Animación</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($)</label>
                        <input type="number" name="precio" class="form-control" placeholder="0.00" step="0.01" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
